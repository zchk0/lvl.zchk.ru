services:
  app:
    image: serversideup/php:8.5-fpm
    container_name: lvl_app_local
    working_dir: /var/www/html
    environment:
      APP_NAME: "LVLzchk"
      APP_ENV: "local"
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"

      LOG_CHANNEL: "stderr"
      LOG_LEVEL: "debug"

      DB_CONNECTION: "sqlite"
      DB_DATABASE: "/var/www/html/database/database.sqlite"

      # оставляю как у тебя (значит нужны таблицы)
      SESSION_DRIVER: "database"
      CACHE_STORE: "database"
      QUEUE_CONNECTION: "database"

      APP_LOCALE: "ru"
      APP_FALLBACK_LOCALE: "ru"

      PIN_COOKIE_NAME: "pin_ok"
      PIN_COOKIE_MINUTES: "60"
      BCRYPT_ROUNDS: "12"
    volumes:
      - ./:/var/www/html
      - lvl_storage_log:/var/www/html/storage/logs
    restart: unless-stopped

  scheduler:
    image: serversideup/php:8.5-cli
    container_name: lvl_scheduler_local
    working_dir: /var/www/html
    command: sh -lc "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      APP_ENV: "local"
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: "sqlite"
      DB_DATABASE: "/var/www/html/database/database.sqlite"
    volumes:
      - ./:/var/www/html
      - lvl_storage_log:/var/www/html/storage/logs
    depends_on:
      - app
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: lvl_nginx_local
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  lvl_storage_log:
