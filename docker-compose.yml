services:
  app:
    image: serversideup/php:8.5-fpm
    container_name: lvl_app
    working_dir: /var/www/html
    environment:
      APP_NAME: "LVLzchk"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "https://lvl.zchk.ru"

      # Логи удобно в stdout/stderr
      LOG_CHANNEL: "stderr"
      LOG_LEVEL: "info"

      DB_CONNECTION: "sqlite"
      DB_DATABASE: "/var/www/html/database/database.sqlite"

      # оставляю как у тебя, но таблицы должны быть
      SESSION_DRIVER: "database"
      CACHE_STORE: "database"
      QUEUE_CONNECTION: "database"

      APP_LOCALE: "ru"
      APP_FALLBACK_LOCALE: "ru"

      BCRYPT_ROUNDS: "12"
    volumes:
      - ./:/var/www/html
      - lvl_storage:/var/www/html/storage
      - lvl_db:/var/www/html/database
    restart: unless-stopped

  scheduler:
    image: serversideup/php:8.5-cli
    container_name: lvl_scheduler
    working_dir: /var/www/html
    command: sh -lc "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "https://lvl.zchk.ru"
      DB_CONNECTION: "sqlite"
      DB_DATABASE: "/var/www/html/database/database.sqlite"
    volumes:
      - ./:/var/www/html
      - lvl_storage:/var/www/html/storage
      - lvl_db:/var/www/html/database
    depends_on:
      - app
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: lvl_nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Активный конфиг (будем переключать http.conf -> https.conf)
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      # Laravel public/ нужна nginx'у
      - ./:/var/www/html:ro

      # webroot для ACME challenge
      - ./certbot/www:/var/www/certbot:ro

      # сертификаты
      - ./letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: lvl_certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["sh", "-lc", "sleep infinity"]
    restart: unless-stopped

volumes:
  lvl_storage:
  lvl_db:
