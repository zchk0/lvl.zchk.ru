server {
    listen 80;
    listen [::]:80;
    server_name lvl.zchk.ru;

    client_max_body_size 512M;

    # Let's Encrypt challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Временно можно отдавать заглушку
    location / {
        return 200 "HTTP is up. Waiting for SSL cert...\n";
    }
}
